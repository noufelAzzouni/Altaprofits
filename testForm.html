<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <title>Test Web-to-Lead Salesforce</title>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <script>
      function timestamp() {
        var response = document.getElementById("g-recaptcha-response");
        if (response == null || response.value.trim() == "") {
          var elems = JSON.parse(document.getElementsByName("captcha_settings")[0].value);
          elems["ts"] = JSON.stringify(new Date().getTime());
          document.getElementsByName("captcha_settings")[0].value = JSON.stringify(elems);
        }
      }
      setInterval(timestamp, 500);
    </script>
  </head>
  <body>
    <form action="https://test.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8&orgId=00DG50000045YRl" method="POST">
      <input type="hidden" name="captcha_settings" value='{"keyname":"recaptchav2","fallback":"true","orgId":"00DG50000045YRl","ts":""}'>
      <input type="hidden" name="oid" value="00DG50000045YRl">
      <input type="hidden" name="retURL" value="https://altaprofits--altaint.sandbox.my.salesforce-setup.com">
      <input type="hidden" name="utm_source__c" id="utm_source__c" value="testFromForm">

      <!-- Débogage (optionnel) -->
      <input type="hidden" name="debug" value="1">
      <input type="hidden" name="debugEmail" value="noufel.azzouni@ornidex.com">

      <label for="first_name">First Name</label>
      <input id="first_name" maxlength="40" name="first_name" size="20" type="text" /><br>

      <label for="last_name">Last Name</label>
      <input id="last_name" maxlength="80" name="last_name" size="20" type="text" /><br>

      <label for="email">Email</label>
      <input id="email" maxlength="80" name="email" size="20" type="email" /><br>

      <label for="company">Company</label>
      <input id="company" maxlength="40" name="company" size="20" type="text" /><br>

      <label for="city">City</label>
      <input id="city" maxlength="40" name="city" size="20" type="text" /><br>

      <label for="state">State/Province</label>
      <input id="state" maxlength="20" name="state" size="20" type="text" /><br>

      <!-- Widget reCAPTCHA -->
      <div class="g-recaptcha" data-sitekey="VOTRE_SITE_KEY"></div>
      <br>

      <input type="submit" name="submit" value="Envoyer">
    </form>
  </body>
</html>
